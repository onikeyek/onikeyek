<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1E2830" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1200" height="300" fill="#10151A" />
  <rect x="0" y="0" width="1200" height="300" fill="url(#grid)" />

  <!-- ===== circuit diagram ===== -->
  <g font-family="Arial, Helvetica, sans-serif">

    <!-- IOT node -->
    <rect x="60" y="75" width="72" height="30" rx="3" fill="#141B21" stroke="#4A6670" stroke-width="1.5" />
    <text x="96" y="94" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#B7C2C9" font-weight="600">IOT</text>

    <!-- DATA node -->
    <rect x="60" y="135" width="72" height="30" rx="3" fill="#141B21" stroke="#4A6670" stroke-width="1.5" />
    <text x="96" y="154" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#B7C2C9" font-weight="600">DATA</text>

    <!-- CLOUD node (deprioritized) -->
    <rect x="60" y="195" width="72" height="30" rx="3" fill="#141B21" stroke="#3A4148" stroke-width="1.5" opacity="0.45" />
    <text x="96" y="214" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#7A828A" font-weight="600" opacity="0.6">CLOUD</text>

    <!-- traces: IOT -> junction -->
    <polyline points="132,90 192,90 192,150 250,150" fill="none" stroke="#4A6670" stroke-width="2" />
    <!-- traces: DATA -> junction (straight) -->
    <polyline points="132,150 250,150" fill="none" stroke="#4A6670" stroke-width="2" />
    <!-- traces: CLOUD -> broken off, dashed, dim -->
    <polyline points="132,210 172,210 172,182" fill="none" stroke="#3A4148" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
    <!-- break marks on cloud trace -->
    <line x1="163" y1="172" x2="181" y2="164" stroke="#3A4148" stroke-width="2" opacity="0.6" />
    <line x1="163" y1="164" x2="181" y2="172" stroke="#3A4148" stroke-width="2" opacity="0.6" />

    <!-- junction dot -->
    <circle cx="250" cy="150" r="3.5" fill="#4A6670" />

    <!-- converged live trace -> security node, glowing amber -->
    <polyline points="250,150 336,150" fill="none" stroke="#E8A657" stroke-width="2.5" filter="url(#glow)" />

    <!-- security node -->
    <circle cx="380" cy="150" r="30" fill="#141B21" stroke="#E8A657" stroke-width="2" filter="url(#glow)" />
    <!-- padlock icon -->
    <rect x="368" y="150" width="24" height="18" rx="3" fill="none" stroke="#E8A657" stroke-width="2" />
    <path d="M 372 150 L 372 142 A 8 8 0 0 1 388 142 L 388 150" fill="none" stroke="#E8A657" stroke-width="2" />
    <text x="380" y="196" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#E8A657" font-weight="700">SEC</text>
  </g>

  <!-- ===== identity block ===== -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="460" y="142" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#EDEAE2">NAIMOT YEKINI</text>
    <text x="460" y="174" font-size="17" font-weight="500" fill="#E8A657">Building secure systems from the hardware up</text>
    <text x="460" y="200" font-size="13" letter-spacing="1" fill="#8B96A0">@onikeyek</text>
  </g>
</svg>
